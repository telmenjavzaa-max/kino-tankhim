:root {

* { box-sizing: border-box; }

      return u.href;
    }
    return u.protocol === "https:" ? u.href : "";
  }

  const heart = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.5-9.2C1 8.3 3.3 5 6.6 5c2 0 3.5 1.1 5.4 3 1.9-1.9 3.4-3 5.4-3C20.7 5 23 8.3 21.5 11.8 19.5 16.4 12 21 12 21z"/></svg>';
  function posterHTML(m, withBadges = true, priority = false) {
    return `<div class="poster" style="--h1:${+m.hue1 || 0};--h2:${+m.hue2 || 220}">
      ${m.poster_url ? `<img src="${esc(m.poster_url)}" alt="${esc(m.title)} постер" width="600" height="848" ${priority ? 'fetchpriority="high" loading="eager"' : 'loading="lazy"'} decoding="async" onerror="this.remove()">` : ""}
      ${withBadges && !m.video_url ? `<span class="soon">Удахгүй</span>` : ""}
      ${withBadges && state.favs.has(m.id) ? `<span class="fav-mark" title="Миний жагсаалтад">${heart}</span>` : ""}
      <div class="p-title">${esc(m.title)}</div>
      <div class="p-year">${esc(m.year)} · ${esc(m.runtime)} мин</div>
    </div>`;
  }

  // ---------- Өгөгдөл ----------
  async function loadMovies() {
    if (sb) {
      const { data, error } = await sb.from("movies").select("*").eq("published", true);
      if (!error && data?.length) { $("#src").textContent = "Supabase"; return data; }
      if (error) console.warn("movies хүснэгт:", error.message);
    }
    return SAMPLE;
  }
  async function loadFavs() {
    if (sb && state.user) {
      const { data, error } = await sb.from("favorites").select("movie_id");
      if (!error) state.favs = new Set(data.map((r) => r.movie_id));
    } else if (!sb) state.favs = new Set(store.get("kino.favs", []));
    else state.favs = new Set();
  }
  async function toggleFav(id) {
    if (sb && !state.user) { openAuth("Жагсаалтдаа нэмэхийн тулд нэвтэрнэ үү."); return; }
    const has = state.favs.has(id);
    if (sb) {
      const { error } = has
        ? await sb.from("favorites").delete().eq("movie_id", id).eq("user_id", state.user.id)
        : await sb.from("favorites").insert({ movie_id: id, user_id: state.user.id });
      if (error) { toast("Хадгалж чадсангүй: " + error.message); return; }
    }
    has ? state.favs.delete(id) : state.favs.add(id);
    if (!sb) store.set("kino.favs", [...state.favs]);
    toast(has ? "Жагсаалтаас хасагдлаа" : "Миний жагсаалтад нэмэгдлээ");
    render();
    if (state.current?.id === id) openMovie(id);
  }

  // ---------- Харуулах ----------
  function visible() {
    const norm = (v) => String(v || "").toLowerCase().replace(/ө/g, "о").replace(/ү/g, "у").replace(/ё/g, "е");
    const q = norm(state.q.trim());
    const by = { new: (a, b) => b.year - a.year || b.id - a.id, title: (a, b) => a.title.localeCompare(b.title, "mn"), runtime: (a, b) => a.runtime - b.runtime }[state.sort] || ((a, b) => b.year - a.year);
    return state.movies.filter((m) =>
      (state.genre === "Бүгд" || m.genre === state.genre) &&
      (!state.favOnly || state.favs.has(m.id)) &&
      (!q || [m.title, m.genre, m.description].some((v) => norm(v).includes(q)))
    ).sort(by);
  }
  function renderFeatured() {
    const top = state.movies.find((m) => m.featured) || [...state.movies].sort((a, b) => b.year - a.year || a.id - b.id)[0];
    if (!top) return;
    $("#featured").innerHTML = `
      ${posterHTML(top, false, true)}
      <div>
        <div class="eyebrow">Онцлох кино · ${esc(top.genre)} · ${esc(top.year)}</div>
        <h1>${esc(top.title)}</h1>
        <p>${esc(top.description)}</p>
        <div class="actions">
          <button class="btn primary" data-play="${top.id}">▶ Үзэх</button>
          <button class="btn" data-open="${top.id}">Дэлгэрэнгүй</button>
        </div>
      </div>`;
  }
  function renderGenres() {
    const genres = ["Бүгд", ...new Set(state.movies.map((m) => m.genre).filter(Boolean))];
    $("#genres").innerHTML = genres.map((g) => `<button class="chip" data-genre="${esc(g)}" aria-pressed="${g === state.genre}">${esc(g)}</button>`).join("");
  }
  function render() {
    renderFeatured(); renderGenres();
    const list = visible();
    $("#count").textContent = `${list.length} / ${state.movies.length} кино`;
    $("#grid").innerHTML = list.length
      ? list.map((m) => `
        <button class="card" data-open="${m.id}" aria-label="${esc(m.title)}, ${esc(m.year)}">
          ${posterHTML(m)}
          <div class="name">${esc(m.title)}</div>
          <div class="meta"><span>${esc(m.genre)}</span><span class="mono">${esc(m.runtime)} мин</span></div>
        </button>`).join("")
      : `<div class="empty">${state.favOnly ? "Жагсаалт хоосон байна. Кино нээгээд ☆ товчийг дарна уу." : "Хайлтад тохирох кино олдсонгүй."}</div>`;
  }

  function openMovie(id, play = false) {
    const m = state.movies.find((x) => x.id === id);
    if (!m) return;
    state.current = m;
    const src = embedUrl(m.video_url);
    const playerHTML = play && src
      ? `<div class="player"><iframe src="${esc(src)}" title="${esc(m.title)}" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen></iframe></div>`
      : "";
    $("#movieBody").innerHTML = `${playerHTML}
      <div class="d-body">
        ${posterHTML(m, false)}
        <div style="min-width:0">
          <h2 id="dTitle">${esc(m.title)}</h2>
          <dl class="facts">
            <dt>Он</dt><dd>${esc(m.year)}</dd>
            <dt>Төрөл</dt><dd>${esc(m.genre)}</dd>
            <dt>Үргэлжлэх</dt><dd>${esc(m.runtime)} мин (${Math.floor(m.runtime / 60)} ц ${m.runtime % 60} мин)</dd>
          </dl>
          <p>${esc(m.description)}</p>
          <div class="actions">
            ${playerHTML ? "" : `<button class="btn primary" data-play="${m.id}" ${src ? "" : "disabled"}>${src ? "▶ Үзэх" : "Видео удахгүй нэмэгдэнэ"}</button>`}
            <button class="btn" data-fav="${m.id}">${state.favs.has(m.id) ? "★ Жагсаалтаас хасах" : "☆ Миний жагсаалтад"}</button>
          </div>
        </div>
      </div>`;
    const dlg = $("#movieDlg");
    if (!dlg.open) dlg.showModal();
  }
  function play(id) {
    if (sb && !state.user) { state.pendingPlay = id; openAuth("Кино үзэхийн тулд нэвтэрнэ үү."); return; }
    openMovie(id, true);
  }

  // ---------- Нэвтрэлт: Google + утас (SMS код) ----------
  function authMsg(text, kind = "") { const m = $("#authMsg"); m.textContent = text; m.className = "msg " + kind; }
  function openAuth(hint) {
    authMsg("");
    $("#phoneForm").hidden = false; $("#codeForm").hidden = true;
    $("#authHint").textContent = sb ? (hint || "Кино үзэхийн тулд утасны дугаар эсвэл Google-ээр нэвтэрнэ үү.")
      : "Нэвтрэлт Supabase холбогдсоны дараа ажиллана. Одоогоор туршилтын горимд байна.";
    if ($("#movieDlg").open) $("#movieDlg").close();
    $("#authDlg").showModal();
  }
  $("#googleBtn").addEventListener("click", async () => {
    if (!sb) { authMsg("Supabase тохируулаагүй байна.", "err"); return; }
    authMsg("Google руу шилжиж байна…");
    const { error } = await sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: location.origin + location.pathname } });
    if (error) authMsg(error.message, "err");
  });
  $("#phoneForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!sb) { authMsg("Supabase тохируулаагүй байна.", "err"); return; }
    const digits = $("#phone").value.replace(/\D/g, "");
    if (!/^[6-9]\d{7}$/.test(digits)) { authMsg("8 оронтой утасны дугаараа оруулна уу (жишээ: 99112233).", "err"); return; }
    state.phone = "+976" + digits;
    $("#sendCodeBtn").disabled = true; authMsg("Код илгээж байна…");
    const { error } = await sb.auth.signInWithOtp({ phone: state.phone });
    $("#sendCodeBtn").disabled = false;
    if (error) { authMsg("Код илгээж чадсангүй: " + error.message, "err"); return; }
    $("#phoneForm").hidden = true; $("#codeForm").hidden = false; $("#code").focus();
    authMsg(`${state.phone} дугаарт код илгээлээ.`, "ok");
  });
  $("#codeForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const token = $("#code").value.replace(/\D/g, "");
    if (token.length !== 6) { authMsg("6 оронтой кодоо оруулна уу.", "err"); return; }
    authMsg("Шалгаж байна…");
    const { error } = await sb.auth.verifyOtp({ phone: state.phone, token, type: "sms" });
    if (error) { authMsg("Код буруу эсвэл хугацаа нь дууссан байна.", "err"); return; }
    $("#authDlg").close(); toast("Нэвтэрлээ");
  });
  $("#changePhone").addEventListener("click", () => { $("#phoneForm").hidden = false; $("#codeForm").hidden = true; authMsg(""); });

  async function onUser(user) {
    state.user = user;
    $("#loginBtn").hidden = !!user; $("#logoutBtn").hidden = !user; $("#who").hidden = !user;
    $("#who").textContent = user ? (user.email || user.phone ? (user.email || "+" + user.phone) : "") : "";
    await loadFavs(); render();
    if (user && state.pendingPlay) { const id = state.pendingPlay; state.pendingPlay = null; openMovie(id, true); }
  }

  // ---------- Үйлдлүүд ----------
  document.addEventListener("click", (e) => {
    const p = e.target.closest("[data-play]"); if (p) { if (!p.disabled) play(+p.dataset.play); return; }
    const o = e.target.closest("[data-open]"); if (o) { openMovie(+o.dataset.open); return; }
    const f = e.target.closest("[data-fav]"); if (f) { toggleFav(+f.dataset.fav); return; }
    const g = e.target.closest("[data-genre]"); if (g) { state.genre = g.dataset.genre; render(); return; }
    const c = e.target.closest("[data-close]"); if (c) c.closest("dialog").close();
  });
  $("#loginBtn").addEventListener("click", () => openAuth());
  $("#logoutBtn").addEventListener("click", async () => { await sb?.auth.signOut(); toast("Гарлаа"); });
  document.addEventListener("keydown", (e) => { if (e.key === "/" && !/input|textarea/i.test(document.activeElement.tagName) && !document.querySelector("dialog[open]")) { e.preventDefault(); $("#q").focus(); } });
  $("#q").addEventListener("input", (e) => { state.q = e.target.value; render(); });
  $("#sort").value = state.sort;
  $("#sort").addEventListener("change", (e) => { state.sort = e.target.value; store.set("kino.sort", state.sort); render(); });
  $("#favOnly").addEventListener("click", (e) => { state.favOnly = !state.favOnly; e.currentTarget.setAttribute("aria-pressed", state.favOnly); render(); });
  // Видео хаахад тоглуулагчийг зогсооно
  $("#movieDlg").addEventListener("close", () => { state.current = null; $("#movieBody").innerHTML = ""; });

  // ---------- Эхлүүлэх ----------
  (async () => {
    state.movies = SAMPLE; render();
    if (!sb) return;
    $("#mode").textContent = "Шууд"; $("#mode").classList.add("live");
    state.movies = await loadMovies();
    const { data } = await sb.auth.getSession();
    await onUser(data.session?.user || null);
    sb.auth.onAuthStateChange((_e, session) => { if ((session?.user?.id || null) !== (state.user?.id || null)) onUser(session?.user || null); });
  })();
})();
</script>
</body>
</html>
